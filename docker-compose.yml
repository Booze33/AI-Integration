version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-initializer-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_initializer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ai-initializer-network

  redis:
    image: redis:7-alpine
    container_name: ai-initailizer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ai-initializer-network

  https-proxy:
    profiles:
      - https-check
    image: caddy:2-alpine
    container_name: ai-initializer-https-proxy
    restart: unless-stopped
    ports:
      - "3443:3443"
      - "3444:3444"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.local/caddy_data:/data
      - ./.local/caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:

networks:
  ai-initializer-network:
    driver: bridge